# ==============================================================================
# EtudePlus - Railway Configuration (Dynamic Deployment)
# Railway offers $5/month free credit for hobbyists
# ==============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.render"

[deploy]
# Start command - runs migrations and starts the app
startCommand = "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ==============================================================================
# RAILWAY SETUP INSTRUCTIONS:
# ==============================================================================
#
# 1. Create a Railway account at https://railway.app
#
# 2. Install Railway CLI:
#    npm install -g @railway/cli
#
# 3. Login to Railway:
#    railway login
#
# 4. Create a new project:
#    railway init
#
# 5. Add PostgreSQL database:
#    railway add --plugin postgresql
#
# 6. Add Redis:
#    railway add --plugin redis
#
# 7. Set environment variables:
#    railway variables set SECRET_KEY=$(openssl rand -hex 32)
#    railway variables set DEBUG=False
#    railway variables set SERVE_FRONTEND=true
#    railway variables set KEYCLOAK_URL=your-keycloak-url
#    railway variables set KEYCLOAK_CLIENT_SECRET=your-client-secret
#
# 8. Deploy:
#    railway up
#
# 9. Get your public URL:
#    railway domain
#
