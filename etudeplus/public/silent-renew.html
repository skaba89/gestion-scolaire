<!DOCTYPE html>
<html>
<head>
    <title>Silent Renew</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3/dist/browser/oidc-client-ts.min.js"></script>
    <script>
        new oidc.LogManager({ level: oidc.LogLevel.INFO });
        new oidcSilentRenew()
            .then(() => {
                console.log("Silent renew completed successfully");
            })
            .catch(err => {
                console.error("Silent renew failed:", err);
            });
    </script>
</body>
</html>
