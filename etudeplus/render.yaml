# ==============================================================================
# EtudePlus - Render Blueprint (Free Tier)
# School Management System - Full Stack Deployment
# ==============================================================================

services:
  # ─── Main Web Service (Backend + Frontend) ───────────────────────────────────
  - type: web
    name: etudeplus
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    
    # Build-time environment variables
    buildEnv:
      VITE_API_URL: ""
      VITE_KEYCLOAK_URL: ""
      VITE_KEYCLOAK_REALM: schoolflow
      VITE_KEYCLOAK_CLIENT_ID: schoolflow-frontend
    
    # Runtime environment variables
    envVars:
      # Database (auto-configured)
      - key: DATABASE_URL
        fromDatabase:
          name: etudeplus-db
          property: connectionString
      
      # Redis (auto-configured)
      - key: REDIS_URL
        fromService:
          name: etudeplus-redis
          type: redis
          property: connectionString
      
      # Auto-generated secret
      - key: SECRET_KEY
        generateValue: true
      
      # Application settings
      - key: DEBUG
        value: "False"
      
      - key: LOG_LEVEL
        value: "INFO"
      
      - key: SERVE_FRONTEND
        value: "true"
      
      # CORS
      - key: BACKEND_CORS_ORIGINS
        value: ""
      
      # Keycloak (configure manually after deployment)
      - key: KEYCLOAK_URL
        sync: false
      
      - key: KEYCLOAK_REALM
        value: "schoolflow"
      
      - key: KEYCLOAK_CLIENT_ID
        value: "schoolflow-backend"
      
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      
      - key: KEYCLOAK_AUDIENCE
        value: "schoolflow-frontend"
      
      # Storage (optional - configure manually)
      - key: MINIO_ENDPOINT
        sync: false
      
      - key: MINIO_ACCESS_KEY
        sync: false
      
      - key: MINIO_SECRET_KEY
        sync: false
      
      - key: MINIO_BUCKET
        value: "schoolflow"
      
      - key: MINIO_SECURE
        value: "false"
      
      # Database pool (optimized for free tier)
      - key: DATABASE_POOL_SIZE
        value: "5"
      
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
    
    # Health check
    healthCheckPath: /health/
    
    # Free tier: 1 instance only
    numInstances: 1
    
    # Auto-deploy
    autoDeploy: true
    
    # Branch to deploy
    branch: master

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  - type: redis
    name: etudeplus-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru

# ─── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: etudeplus-db
    databaseName: schoolflow
    region: oregon
    plan: free
    user: schoolflow_user
    postgresMajorVersion: 15

# ==============================================================================
# RENDER DEPLOYMENT INSTRUCTIONS
# ==============================================================================
#
# 1. Go to https://render.com and sign up with GitHub
# 2. Click "New +" → "Blueprint"
# 3. Select this repository: gestion-scolaire
# 4. Click "Apply" to create all services
# 5. Wait 5-10 minutes for deployment
#
# AFTER DEPLOYMENT:
# - Your app URL: https://etudeplus.onrender.com
# - API docs: https://etudeplus.onrender.com/docs
#
# CONFIGURE THESE IN RENDER DASHBOARD:
# - KEYCLOAK_URL: Your Keycloak instance URL
# - KEYCLOAK_CLIENT_SECRET: From Keycloak client credentials
# - MINIO_*: Your S3-compatible storage credentials
#
# ==============================================================================
